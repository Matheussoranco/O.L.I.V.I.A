[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olivia"
version = "0.4.0"
description = "Open Learning Intelligence & Virtual Investigation Assistant — an AI agent for study, learning, and scientific discovery"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.10"
authors = [{ name = "Matheus Soranço", email = "matheussoranco@gmail.com" }]
keywords = ["agent", "science", "research", "learning", "neuro-symbolic", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

# Core is deliberately lean: everything heavier is an optional extra with a
# graceful in-code fallback, so OLIVIA imports and runs offline.
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.50,<1.0",
]
graph = [
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
]
science = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "sympy>=1.12,<2.0",
    "networkx>=3.2,<4.0",
]
docs = [
    "pymupdf>=1.24,<2.0",
    "beautifulsoup4>=4.12,<5.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff==0.15.2",   # pinned exactly: see .github/workflows/ci.yml
]
all = [
    "anthropic>=0.50,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<2.0",
    "sympy>=1.12,<2.0",
    "networkx>=3.2,<4.0",
    "pymupdf>=1.24,<2.0",
    "beautifulsoup4>=4.12,<5.0",
]

[project.scripts]
olivia = "olivia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olivia"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Allow non-ASCII punctuation in docstrings/strings (en-dashes, arrows).
    "RUF001",
    "RUF002",
    "RUF003",
    # Tool/expert JSON-Schema class attributes are read-only signatures.
    "RUF012",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
