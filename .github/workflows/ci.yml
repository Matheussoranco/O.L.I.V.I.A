name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        # ruff is pinned exactly in the [dev] extra, and must stay that way:
        # unpinned means the rule set is whatever the newest release defaults
        # to. Ruff 0.16.0 widened its built-in defaults and turned a sibling
        # project's CI red with 89 findings in code that had not changed.
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # The `science` extra supplies sympy/scipy, which the solver and stats
        # tools import; `dev` supplies pytest + ruff.
        run: pip install -e ".[dev,science]"

      - name: Run tests
        # No API keys: the suite is offline by contract — conftest forces the
        # null LLM provider and hard-fails any attempted network call.
        run: pytest tests/ --tb=short -q
